<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Sorting Visualizer</h1>
        <div class="controls text-center mb-4">
            <button id="generateArray" class="btn btn-primary">Generate Random Array</button>
            <div class="my-2">
                <label for="arraySize">Array Size:</label>
                <input type="range" id="arraySize" min="5" max="100" value="50" class="mx-2">
                <span id="sizeValue">50</span>
            </div>
            <div class="my-2">
                <label for="speed">Speed:</label>
                <input type="range" id="speed" min="1" max="1000" value="500" class="mx-2">
                <span id="speedValue">500ms</span>
            </div>
            <div class="my-2">
                <label for="algorithm">Select Algorithm:</label>
                <select id="algorithmSelect" class="form-select d-inline-block w-auto">
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="quick">Quick Sort</option>
                </select>
                <button id="sortArray" class="btn btn-success">Start Sorting</button>
            </div>
        </div>
        <div id="arrayContainer" class="d-flex justify-content-center align-items-end" style="height: 400px; border: 1px solid #ccc;">
            <!-- Bars will be generated here -->
        </div>
        <div id="info" class="text-center mt-4">
            <p>Comparisons: <span id="comparisons">0</span></p>
            <p>Swaps: <span id="swaps">0</span></p>
            <p>Execution Time: <span id="executionTime">0</span> ms</p>
            <p>Time Complexity: <span id="timeComplexity">O(n^2)</span></p>
        </div>
    </div>
    <script src="js/script.js" defer></script>
</body>
</html>
